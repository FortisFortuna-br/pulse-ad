[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-ad"
version = "0.1.0"
description = "Pulse - Hybrid Identity Attack Path Engine (on-prem AD -> Entra ID)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "FortisFortuna-br"}]
keywords = ["active-directory", "entra-id", "azure-ad", "bloodhound",
            "attack-path", "hybrid-identity", "red-team", "security"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FortisFortuna-br/pulse-ad"
Repository = "https://github.com/FortisFortuna-br/pulse-ad"

[project.scripts]
pulse = "pulse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["pulse*"]
